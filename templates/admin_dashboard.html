<!DOCTYPE html>
<html>
<head>

    <title>Admin Dashboard</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f8;
        }

        nav {
            background: #222;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        .cards {
            display: flex;
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            width: 250px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        .card h3 {
            color: #555;
        }

        .card p {
            font-size: 40px;
            font-weight: bold;
            color: #667eea;
        }

    </style>

</head>

<body>

<nav>

    <h2>Attendance Management</h2>

    <div>
        <a href="/admin_dashboard">Dashboard</a>
        <a href="/students">Students</a>
        <a href="/attendance">Attendance</a>
        <a href="/logout">Logout</a>
    </div>

</nav>

<div class="container">

    <h1>Admin Dashboard</h1>

    <p>Welcome, Admin!</p>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <p>{{ total_students }}</p>
        </div>

        <div class="card">
            <h3>Total Present</h3>
            <p>{{ total_present }}</p>
        </div>

        <div class="card">
            <h3>Total Absent</h3>
            <p>{{ total_absent }}</p>
        </div>

    </div>

</div>

</body>
</html>
